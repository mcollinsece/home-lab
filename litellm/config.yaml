# LiteLLM model routing config.
# Mounted read-only at /app/config.yaml inside the container.
# Restart after changes: docker compose -f ~/home-lab/docker/compose.yml restart litellm
#
# Bedrock inference profile IDs: use `us.anthropic.<name>` for Claude 4.x+
# (no date suffix — newer profiles dropped the date).
# Verify available IDs: curl -sf https://bedrock.<region>.amazonaws.com/inference-profiles \
#   --aws-sigv4 "aws:amz:<region>:bedrock" --user "<key>:<secret>" | python3 -m json.tool

model_list:

  # --- Bedrock: Claude Sonnet 4.6 (cross-region inference profile) ---
  # max_tokens: 64000 — Bedrock rejects requests with max_tokens > 128000 total;
  # setting this caps what LiteLLM forwards so agents that request 200K don't 400.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-6
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION
      max_tokens: 64000
    model_info:
      max_tokens: 64000
      max_input_tokens: 128000
      max_output_tokens: 64000

  # Alias so both the short name and the full ARN form resolve to the same backend.
  - model_name: bedrock/us.anthropic.claude-sonnet-4-6
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-6
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION
      max_tokens: 64000
    model_info:
      max_tokens: 64000
      max_input_tokens: 128000
      max_output_tokens: 64000

  # --- Future providers (uncomment when credentials are available) ---
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # - model_name: gemini-2-5-pro
  #   litellm_params:
  #     model: gemini/gemini-2.5-pro
  #     api_key: os.environ/GOOGLE_API_KEY

  # - model_name: grok-3
  #   litellm_params:
  #     model: xai/grok-3
  #     api_key: os.environ/XAI_API_KEY

  # - model_name: ollama-local
  #   litellm_params:
  #     model: openai/mistral
  #     api_base: http://host.docker.internal:11434/v1
  #     api_key: none

  # --- claude-code agent via wrapper (added for claude-code-revproxy) ---
  # Additional OpenShell sandbox with claude-code-openai-wrapper running persistently.
  # - Inbound: LiteLLM reverse-proxies here so NemoClaw/OpenClaw director sees
  #   the full claude-code agent (tools enabled via extra_body) as just another model.
  # - Outbound (agent brain): uses Bedrock directly inside the sandbox (via --bedrock
  #   injection + existing claude-code.yaml policy). Future: can route via inference.local
  #   once wrapper supports ANTHROPIC_BASE_URL (see repo issue #37).
  # After `osbox claude-code-agent --bedrock --wrapper --headless`:
  #   1. docker ps | grep claude-code-agent   (note the full container name, e.g. openshell-claude-code-agent-xxx)
  #   2. Replace the placeholder below with that name (or its IP on ai-net).
  #   3. docker compose -f docker/compose.yml restart litellm
  # The internal key must match the one set by osbox --wrapper.
  - model_name: claude-code-sonnet
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: http://claude-code-wrapper:8000/v1
      api_key: claude-code-internal-revproxy-key-2026
    model_info:
      max_tokens: 64000
      max_input_tokens: 128000
      max_output_tokens: 64000

  # Alias (optional)
  - model_name: claude-code/sonnet
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: http://claude-code-wrapper:8000/v1
      api_key: claude-code-internal-revproxy-key-2026
    model_info:
      max_tokens: 64000
      max_input_tokens: 128000
      max_output_tokens: 64000

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
